<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>YupiStars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#16171c;--card:#25262b;--card2:#31333b;--tx:#f2f3f7;--mut:#9a9eac;--acc:#7c5cff;--gold:#ffc83d;--grn:#35e07a;--red:#ff5470}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(86px + env(safe-area-inset-bottom))}
img{display:block;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px}
.logo{font-weight:800;font-size:20px}
.bal{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:22px;padding:6px 8px 6px 14px;font-weight:800;color:var(--gold)}
.bal b{background:var(--acc);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;cursor:pointer}
button{font:inherit;border:0;border-radius:14px;padding:13px 18px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;width:100%;transition:transform .1s,opacity .2s}
button:active{transform:scale(.97)}button.sec{background:var(--card2)}button.red{background:#4a2330;color:var(--red)}button:disabled{opacity:.45}
h2{margin:6px 0 12px}.mut{color:var(--mut);font-size:13px}
.sec-v{display:none}.sec-v.on{display:block;animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.case{background:#34353b;border-radius:22px;padding:8px 8px 12px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center}
.case img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:16px}
.case .row{display:flex;justify-content:space-between;width:100%;padding:6px 6px 0;font-weight:700}
.case .row span{color:var(--gold);display:flex;align-items:center;gap:3px}
.lim{position:absolute;top:10px;left:10px;background:#2f5bd8;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:700}
.st{width:16px;height:16px;display:inline-block;vertical-align:-2px}
.back{background:none;color:var(--mut);width:auto;padding:6px 0}
.roll{overflow:hidden;background:var(--card);border-radius:18px;margin:12px 0;position:relative;height:128px}
.roll:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);z-index:2;box-shadow:0 0 14px var(--gold)}
.roll:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--bg) 0,#0000 22%,#0000 78%,var(--bg) 100%);opacity:.7}
.strip{display:flex;height:100%;will-change:transform}
.it{flex:0 0 104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.it img{width:76px;height:76px;object-fit:contain}.it small{font-size:12px;color:var(--gold);font-weight:700}
.it.w{background:radial-gradient(#ffc83d55,#0000 70%)}
.burst{animation:burst .55s ease-out}
@keyframes burst{0%{box-shadow:0 0 0 0 #ffc83daa;transform:scale(1)}30%{box-shadow:0 0 40px 14px #ffc83d88;transform:scale(1.035)}100%{box-shadow:0 0 0 0 #0000;transform:scale(1)}}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pz{background:var(--card);border-radius:16px;padding:8px 4px 8px;text-align:center;position:relative}
.pz img{width:64px;height:64px;object-fit:contain;margin:0 auto 4px}
.pz small{display:block;font-size:12px;color:var(--gold);font-weight:700}.pz i{display:block;font-style:normal;font-size:11px;color:var(--mut);min-height:14px}
.pz.sel{outline:2px solid var(--acc)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#101115ee;backdrop-filter:blur(10px);z-index:5}
.nav div{flex:1;text-align:center;padding:8px 0;border-radius:14px;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer}
.nav div span{display:block;font-size:22px}.nav div.on{background:var(--card);color:var(--tx)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.c{align-items:center;padding:20px}
.box{background:var(--card);border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;text-align:center;max-height:82vh;overflow:auto;animation:up .25s}
.modal.c .box{border-radius:26px;max-width:380px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.big{width:150px;height:150px;object-fit:contain;margin:0 auto}
.gp{color:var(--gold);font-weight:800;font-size:18px}
.btns{display:grid;gap:8px;margin-top:14px}
input{width:100%;font:inherit;font-size:22px;text-align:center;background:var(--card2);border:0;border-radius:14px;padding:14px;color:var(--tx);margin:12px 0;outline:none;user-select:text}
.chips{display:flex;gap:8px;margin-bottom:12px}.chips button{padding:9px 0;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
/* апгрейд */
.up{background:linear-gradient(160deg,#2a2650,#1d1e2a 60%);border-radius:26px;padding:16px;border:1px solid #3b3670}
.slots{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:6px}
.slot{background:#14151b;border:2px dashed #3d4050;border-radius:20px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--mut);text-align:center;padding:6px}
.slot.f{border-style:solid;border-color:var(--acc)}.slot.t.f{border-color:var(--grn)}
.slot img{width:70%;height:62%;object-fit:contain}.slot b{color:var(--gold);font-size:13px}.slot .pl{font-size:34px;color:#555a6e;line-height:1}
.arr{text-align:center;font-size:22px;color:var(--mut)}
.wheel-w{max-height:0;overflow:hidden;transition:max-height .6s ease,opacity .6s;opacity:0}
.wheel-w.open{max-height:330px;opacity:1}
.wheel{position:relative;width:230px;height:230px;margin:18px auto 6px}
.wheel svg{width:100%;height:100%;filter:drop-shadow(0 0 16px #35e07a33)}
.ptr{position:absolute;inset:0}
.ptr:before{content:"";position:absolute;left:50%;top:-4px;margin-left:-9px;border:9px solid transparent;border-top:20px solid #fff;filter:drop-shadow(0 0 6px #fff)}
.ptr:after{content:"";position:absolute;left:50%;top:14px;width:2px;height:26px;margin-left:-1px;background:#fff8}
.wc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.wc b{font-size:44px;line-height:1;color:var(--grn)}.wc span{font-size:12px;color:var(--mut)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{padding:9px}
.msg{color:var(--mut);font-size:13px;min-height:18px;margin-top:8px}
.tot{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tot button{width:auto;padding:9px 14px;font-size:14px}

/* ===== иконки: одинаковые квадраты, мягкая тень ===== */
.pz img,.it img,.slot img,.big,.mt img{aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 3px 7px #0007)}
.case img{background:none;border-radius:0;filter:drop-shadow(0 6px 14px #8b5cff55)}
.pz img{width:68px;height:68px}.it img{width:80px;height:80px}.big{width:160px;height:160px}
.slot img{width:76%;height:auto;max-height:66%}
/* ===== неон ===== */
:root{--bg:#090912;--acc:#8b5cff;--cy:#22e3ff;--pk:#ff3df0;--card:#25262b}
html{background:var(--bg)}
body{background:radial-gradient(520px 380px at 8% -4%,#7c3cff55,#0000),radial-gradient(460px 380px at 100% 18%,#00e5ff30,#0000),radial-gradient(480px 460px at 0% 100%,#ff3df030,#0000),var(--bg);background-attachment:fixed}
button{background:linear-gradient(135deg,#8b5cff,#4f7dff);box-shadow:0 0 18px #7c5cff77,inset 0 1px #ffffff44}
button.sec{background:#2a2c3d;box-shadow:none;border:1px solid #ffffff14}
button.red{background:#4a2330;box-shadow:none}
.hdr{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 16px}
.logo{font-weight:900;font-size:24px;letter-spacing:1px;background:linear-gradient(90deg,var(--cy),var(--acc),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #8b5cff99)}
.balp{display:flex;align-items:center;gap:14px;background:#ffffff10;border:1px solid #ffffff1c;border-radius:32px;padding:7px 7px 7px 20px;font-size:22px;font-weight:800;box-shadow:0 0 22px #8b5cff33}
.balp #bal{display:flex;align-items:center;gap:7px}.balp .st{width:24px;height:24px}
.balp button{width:auto;padding:10px 20px;font-size:16px;border-radius:24px}
.live{display:flex;align-items:center;gap:14px;background:#ffffff0c;border:1px solid #ffffff16;border-radius:26px;padding:12px 16px;margin-bottom:16px;overflow:hidden}
.live b{font-size:24px;letter-spacing:1px;color:#fff;text-shadow:0 0 14px var(--cy)}
.marq{overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(90deg,#0000,#000 8%,#000 92%,#0000);mask-image:linear-gradient(90deg,#0000,#000 8%,#000 92%,#0000)}
.mt{display:flex;gap:12px;width:max-content;animation:mq 45s linear infinite}
.mt img{width:54px;height:54px;object-fit:contain}
@keyframes mq{to{transform:translateX(-50%)}}
.tile{display:flex;align-items:center;gap:16px;border-radius:32px;padding:14px 20px;margin-bottom:14px;min-height:118px;cursor:pointer;position:relative;overflow:hidden;border:1px solid #ffffff26;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile:before{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,#0000,#ffffff2e,#0000);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-80px}100%{left:120%}}
.tile img{width:86px;height:86px;object-fit:contain;filter:drop-shadow(0 0 14px #ffffff66)}
.tile h3{margin:0;font-size:28px;line-height:1.1}.tile p{margin:6px 0 0;color:#ffffffa8;font-size:18px}
.t-free{background:linear-gradient(135deg,#1c2850,#2b2f4a);box-shadow:0 0 24px #3b6bff3a}
.t-roul{background:linear-gradient(120deg,#5d1f95,#c2306e 62%,#ff8a4c);box-shadow:0 0 28px #ff3df05a}
.t-cases{background:linear-gradient(120deg,#2342d6,#2f6bff);box-shadow:0 0 28px #2f6bff70}
.new{background:#fff;color:#111;font-weight:800;border-radius:18px;padding:5px 15px;font-size:15px;display:inline-block;margin-top:8px}
.case{border:1px solid #8b5cff55;box-shadow:0 0 18px #8b5cff26;transition:transform .15s}.case:active{transform:scale(.97)}
.pz{border:1px solid #ffffff12}
.roll{border:1px solid #8b5cff66;box-shadow:0 0 26px #8b5cff40}
.nav{border-top:1px solid #8b5cff44}.nav div.on{background:#8b5cff2e;color:#fff;box-shadow:0 0 16px #8b5cff55 inset}
.box{border:1px solid #8b5cff55;box-shadow:0 0 40px #8b5cff40}
.up{border:1px solid #8b5cff88;box-shadow:0 0 30px #8b5cff44}
.rwrap{position:relative;width:min(330px,88vw);margin:14px auto 8px;filter:drop-shadow(0 0 22px #8b5cff88)}
.rwrap svg{width:100%;display:block}
.rptr{position:absolute;left:50%;top:-8px;margin-left:-13px;border:13px solid transparent;border-top:26px solid #fff;z-index:2;filter:drop-shadow(0 0 8px #fff)}
.rres{text-align:center;font-size:22px;font-weight:800;min-height:30px}
.rhist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}.rhist span{border-radius:10px;padding:3px 9px;font-size:13px;font-weight:800}
</style>
</head>
<body>
<div class="hdr"><div class="logo">YupiStars</div><div class="balp"><span id="bal">0</span><button onclick="openDep()">Пополнить</button></div></div>

<div id="v-home" class="sec-v on">
  <div class="live"><b>ТОП</b><div class="marq" id="marq"></div></div>
  <div class="tile t-free" onclick="openList('free')"><img id="ti1"><div><h3>Бесплатно</h3><p>2 кейса</p></div></div>
  <div class="tile t-roul" onclick="go('roul')"><img id="ti2"><div><h3>Рулетка</h3><span class="new">Новое</span></div></div>
  <div class="tile t-cases" onclick="openList('cases')"><img id="ti3"><div><h3>Кейсы</h3><p id="ccount"></p></div></div>
</div>

<div id="v-cases" class="sec-v"><h2 id="lt"></h2>
  <div id="list" class="grid"></div>
  <div id="cv" style="display:none">
    <button class="back" onclick="home()">← Назад</button>
    <h2 id="vt"></h2>
    <div class="roll" id="roll"><div class="strip" id="strip"></div></div>
    <button id="go"></button>
    <div class="pg" id="prizes"></div>
  </div>
</div>

<div id="v-roul" class="sec-v">
  <h2>Рулетка</h2>
  <div class="rwrap"><div class="rptr"></div><div id="rw"></div></div>
  <div class="rres" id="rres"></div>
  <input id="rbet" type="number" inputmode="numeric" value="50" min="1">
  <div class="chips"><button class="sec" onclick="setBet(10)">10</button><button class="sec" onclick="setBet(50)">50</button><button class="sec" onclick="setBet(100)">100</button><button class="sec" onclick="setBet(+$('rbet').value*2)">x2</button><button class="sec" onclick="setBet(balance)">Max</button></div>
  <button id="rgo" onclick="rspin()">Крутить</button>
  <div class="rhist" id="rhist"></div>
</div>

<div id="v-up" class="sec-v">
  <h2>Апгрейд</h2>
  <div class="up">
    <div class="slots">
      <div class="slot" id="sm" onclick="pickMine()"></div><div class="arr">➜</div><div class="slot t" id="st" onclick="pickTarget()"></div>
    </div>
    <div class="wheel-w" id="ww">
      <div class="wheel">
        <svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="96" fill="#14151b" stroke="#2c2f3b" stroke-width="20"/>
          <circle id="arc" cx="115" cy="115" r="96" fill="none" stroke="#35e07a" stroke-width="20" stroke-linecap="butt" transform="rotate(-90 115 115)" stroke-dasharray="0 603"/></svg>
        <div class="ptr" id="ptr"></div>
        <div class="wc"><b id="pc">0%</b><span>шанс</span></div>
      </div>
    </div>
    <button id="upgo" style="margin-top:14px" disabled onclick="doUp()">Выбери подарки</button>
  </div>
  <p class="mut" style="text-align:center">Выбери свой подарок и тот, который хочешь получить. Чем больше разница в цене, тем меньше шанс. Проигрыш — подарок сгорает.</p>
</div>

<div id="v-inv" class="sec-v">
  <h2>Инвентарь</h2>
  <div class="tot"><div><div class="mut">Стоимость</div><div class="gp" id="invsum">0</div></div><button class="sec" onclick="sellAll()">Продать всё</button></div>
  <div class="pg" id="invg"></div>
</div>

<div class="nav">
  <div class="on" data-t="home"><span>🏠</span>Главная</div>
  <div data-t="up"><span>⚡</span>Апгрейд</div>
  <div data-t="inv"><span>🎒</span>Инвентарь</div>
</div>

<div class="modal c" id="dep"><div class="box">
  <h2 style="margin:0">Пополнение</h2>
  <input id="amt" type="number" inputmode="numeric" min="1" max="10000" placeholder="Сумма в ★">
  <div class="chips"><button class="sec" onclick="amt.value=100">100</button><button class="sec" onclick="amt.value=500">500</button><button class="sec" onclick="amt.value=1000">1000</button></div>
  <button id="pay" onclick="pay()">Получить счёт</button>
  <button class="sec" onclick="hide('dep')" style="margin-top:8px">Закрыть</button>
  <div class="msg" id="dmsg"></div>
</div></div>
<div class="modal c" id="win"><div class="box" id="wbox"></div></div>
<div class="modal" id="sheet" onclick="if(event.target===this)hide('sheet')"><div class="box" id="sbox"></div></div>

const ITEMS = {};
CASES.forEach(c => c.pr = c.pr.map(([i,p,n]) => ITEMS[i+"_"+p] = {k:i+"_"+p,i,p,n}));
const rtp=(c,e)=>{let s=0,v=0;c.pr.forEach(x=>{const a=Math.pow(x.p,-e);s+=a;v+=a*x.p});return v/s/c.price};
CASES.forEach(c=>{ if(!c.price){c.e=1.35;return} let lo=.2,hi=6; for(let k=0;k<50;k++){const m=(lo+hi)/2; rtp(c,m)>TARGET_RTP?lo=m:hi=m} c.e=(lo+hi)/2 });
const pick = c => { const W=c.pr.map(x=>Math.pow(x.p,-c.e)); let r=Math.random()*W.reduce((a,b)=>a+b,0); for(let i=0;i<W.length;i++){ r-=W[i]; if(r<=0) return c.pr[i] } return c.pr.at(-1) };

const tot = () => inv.reduce((s,x)=>s+ITEMS[x.k].p,0);

const freeLeft = c => Math.max(0,(fl[c.id]||0)+c.cd*3600000-Date.now());
function updGo(){ if(busy||!cur) return; const b=$("go");
  if(cur.free){ const l=freeLeft(cur); b.disabled=l>0; b.textContent = l>0 ? "Доступно через "+[l/3600000|0,(l/60000|0)%60,(l/1000|0)%60].map(n=>String(n).padStart(2,"0")).join(":") : "Открыть бесплатно" }
  else { b.disabled=false; b.innerHTML=`Открыть за ${stIcon} ${fmt(cur.price)}` } }
setInterval(()=>{ if($("cv").style.display==="block") updGo() },1000);
function openCase(i){
  cur = CASES[i]; $("list").style.display="none"; $("cv").style.display="block";
  $("vt").textContent = cur.name; $("go").onclick = spin; updGo();
  $("strip").style.transform="none"; $("strip").innerHTML = cur.pr.slice(0,8).map(it).join("");
  $("prizes").innerHTML = [...cur.pr].sort((a,b)=>b.p-a.p).map(x=>`<div class="pz">${im(x.k)}<i>${x.i==="star"?"":x.n}</i><small>${fmt(x.p)} ★</small></div>`).join("");
}
// анимация: быстрый старт и плавное замедление (easeOutQuart)
function anim(dur, from, to, cb, done){ const t0=performance.now();
  (function f(now){ const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,4); cb(from+(to-from)*e); t<1?requestAnimationFrame(f):done&&done() })(t0) }
async function spin(){
  if(busy) return;
  if(cur.free){ if(freeLeft(cur)>0) return }
  else if(balance < cur.price){ openDep(cur.price-balance); return }
  busy = true; $("go").disabled = true;
  let prize;
  if(cur.free){ prize = pick(cur); fl[cur.id]=Date.now(); sv("fl",fl) }
  else if(API_URL){ const r = await api("/api/open",{case:cur.id}); if(r.error){ busy=false; $("go").disabled=false; return alert(r.error) }
    prize = cur.pr.find(x=>x.n===r.prize); setBal(r.balance) } else { prize = pick(cur); setBal(balance-cur.price) }
  const N=62, W=104, wi=52, items = Array.from({length:N},(_,i)=> i===wi?prize:cur.pr[Math.random()*cur.pr.length|0]);
  const s=$("strip"), r=$("roll"); s.innerHTML = items.map(it).join(""); s.style.transform="none";
  r.classList.remove("burst"); void r.offsetWidth; r.classList.add("burst");   // всплеск
  const end = wi*W + W/2 - r.clientWidth/2 + (Math.random()*.6-.3)*W; let last=-1;
  anim(6500, 0, end, x=>{ s.style.transform=`translateX(${-x}px)`; const k=Math.floor((x+r.clientWidth/2)/W); if(k!==last){ last=k; haptic("s") } }, ()=>{
    s.children[wi].classList.add("w"); setTimeout(()=>{ reward(prize); busy=false; updGo() }, 500) });
}
function reward(p){
  haptic("success");
  if(p.i==="star"){ setBal(balance+p.p); $("wbox").innerHTML=`${im(p.k,"big")}<h2>${p.n}</h2><div class="mut">Звёзды зачислены на баланс</div><div class="btns"><button onclick="hide('win')">Отлично</button></div>` }
  else { const u=uid(); inv.push({u,k:p.k}); save();
    $("wbox").innerHTML=`${im(p.k,"big")}<h2 style="margin:8px 0 2px">${p.n}</h2><div class="gp">${fmt(p.p)} ★</div>
    <div class="btns"><button class="sec" onclick="sell('${u}');hide('win')">Продать за ${fmt(p.p)} ★</button><button onclick="hide('win')">В инвентарь</button></div>` }
  show("win");
}

// ===== ИНВЕНТАРЬ =====
function renderInv(){
  $("invsum").innerHTML = `${stIcon} ${fmt(tot())}`;
  $("invg").innerHTML = inv.length ? [...inv].reverse().map(x=>{const p=ITEMS[x.k];return `<div class="pz" onclick="itemMenu('${x.u}')">${im(x.k)}<i>${p.n}</i><small>${fmt(p.p)} ★</small></div>`}).join("")
    : `<div class="empty" style="grid-column:1/-1">Пока пусто.<br>Открой кейс, чтобы получить подарок</div>`;
}
function itemMenu(u){
  const x=inv.find(o=>o.u===u); if(!x) return; const p=ITEMS[x.k];
  $("sbox").innerHTML=`${im(x.k,"big")}<h2 style="margin:8px 0 2px">${p.n}</h2><div class="gp">${fmt(p.p)} ★</div>
   <div class="btns"><button onclick="hide('sheet');goUp('${u}')">⚡ Апгрейд</button>
   <button class="sec" onclick="sell('${u}');hide('sheet')">Продать за ${fmt(p.p)} ★</button>
   <button class="sec" onclick="withdraw('${u}')">Вывести подарок</button></div>`; show("sheet");
}
function sell(u){ const i=inv.findIndex(o=>o.u===u); if(i<0) return; setBal(balance+ITEMS[inv[i].k].p); inv.splice(i,1); if(up.m===u) up.m=null; save(); renderUp() }
function sellAll(){ if(!inv.length) return; if(confirm("Продать все подарки за "+fmt(tot())+" ★?")){ setBal(balance+tot()); inv=[]; up={m:null,t:up.t}; save(); renderUp() } }
function withdraw(u){ const x=inv.find(o=>o.u===u), p=ITEMS[x.k];
  const t=`Хочу вывести подарок: ${p.n} (${p.p} ★). ID: ${tg?.initDataUnsafe?.user?.id||"?"}`;
  const l=`https://t.me/${RELAY}?text=${encodeURIComponent(t)}`; tg?tg.openTelegramLink(l):window.open(l) }

// ===== АПГРЕЙД =====
const chance = () => { if(!up.m||!up.t) return 0; const a=ITEMS[inv.find(o=>o.u===up.m).k].p, b=ITEMS[up.t].p; return Math.max(1,Math.min(90,Math.floor(a/b*100*EDGE))) };
const slot = (k,txt) => k ? `${im(k)}<b>${fmt(ITEMS[k].p)} ★</b><span>${ITEMS[k].n}</span>` : `<div class="pl">+</div>${txt}`;
function renderUp(){
  if(up.m && !inv.find(o=>o.u===up.m)) up.m=null;
  const mk = up.m && inv.find(o=>o.u===up.m).k; if(up.t && mk && ITEMS[up.t].p<=ITEMS[mk].p) up.t=null;
  $("sm").innerHTML=slot(mk,"Твой подарок"); $("sm").classList.toggle("f",!!mk);
  $("st").innerHTML=slot(up.t,"Хочу получить"); $("st").classList.toggle("f",!!up.t);
  const c=chance(), ok=up.m&&up.t, C=2*Math.PI*96;
  $("ww").classList.toggle("open",!!ok); $("arc").setAttribute("stroke-dasharray",`${C*c/100} ${C}`); $("pc").textContent=c+"%";
  $("upgo").disabled=!ok||busy; $("upgo").textContent=ok?`Апгрейд · шанс ${c}%`:"Выбери подарки";
}
function goUp(u){ up.m=u; go("up"); renderUp() }
function pickMine(){
  if(!inv.length){ $("sbox").innerHTML=`<div class="empty">Инвентарь пуст</div>`; return show("sheet") }
  $("sbox").innerHTML=`<h2>Твой подарок</h2><div class="pick">`+[...inv].sort((a,b)=>ITEMS[b.k].p-ITEMS[a.k].p).map(x=>{const p=ITEMS[x.k];return `<div class="pz" onclick="up.m='${x.u}';hide('sheet');renderUp()">${im(x.k)}<i>${p.n}</i><small>${fmt(p.p)} ★</small></div>`}).join("")+`</div>`; show("sheet") }
function pickTarget(){
  const min = up.m ? ITEMS[inv.find(o=>o.u===up.m).k].p : 0;
  const best={}; Object.values(ITEMS).forEach(x=>{ if(x.i!=="star"&&(!best[x.i]||x.p>best[x.i].p)) best[x.i]=x });
  const L = Object.values(best).filter(x=>x.p>min).sort((a,b)=>a.p-b.p);
  $("sbox").innerHTML=`<h2>Какой подарок хочешь?</h2>`+(L.length?`<div class="pick">`+L.map(p=>`<div class="pz" onclick="up.t='${p.k}';hide('sheet');renderUp()">${im(p.k)}<i>${p.n}</i><small>${fmt(p.p)} ★</small></div>`).join("")+`</div>`:`<div class="empty">Нет подарков дороже</div>`); show("sheet") }
function doUp(){
  if(busy||!up.m||!up.t) return; busy=true; renderUp();
  const c=chance(), win=Math.random()*100<c, arc=c*3.6;
  const ang = win ? arc*(.08+.84*Math.random()) : arc+(360-arc)*(.04+.92*Math.random());
  const to = (Math.floor(rot/360)+1)*360 + 360*6 + ang, from = rot;
  const old=inv.find(o=>o.u===up.m), tk=up.t;
  anim(7000, from, to, x=>{ rot=x; $("ptr").style.transform=`rotate(${x}deg)` }, ()=>{
    rot = to % 360; $("ptr").style.transform=`rotate(${rot}deg)`;
    inv=inv.filter(o=>o!==old); let nu=null; if(win){ nu=uid(); inv.push({u:nu,k:tk}) } save();
    const p=ITEMS[tk];
    $("wbox").innerHTML = win ? `${im(tk,"big")}<h2 style="color:var(--grn);margin:8px 0 2px">Успех!</h2><div>${p.n}</div><div class="gp">${fmt(p.p)} ★</div><div class="btns"><button onclick="hide('win')">Забрать</button></div>`
      : `${im(old.k,"big")}<h2 style="color:var(--red);margin:8px 0 2px">Не повезло</h2><div class="mut">Подарок сгорел. Попробуй ещё раз!</div><div class="btns"><button onclick="hide('win')">Ок</button></div>`;
    haptic(win?"success":"error"); show("win"); up={m:null,t:null}; busy=false; rot=0; $("ptr").style.transform="none"; renderUp();
  });
}

// ===== ПОПОЛНЕНИЕ ЗВЁЗДАМИ =====
function openDep(need){ $("dmsg").textContent = need ? "Не хватает "+fmt(need)+" ★" : ""; if(need) $("amt").value=need; show("dep") }
async function pay(){
  const a = Math.floor(+$("amt").value);
  if(!(a>=1 && a<=10000)) return $("dmsg").textContent="Введи число от 1 до 10 000";
  if(!API_URL){ setBal(balance+a); hide("dep"); return alert("Демо: начислено "+fmt(a)+" ★. Подключи сервер для реальной оплаты.") }
  $("pay").disabled=true; $("dmsg").textContent="Создаю счёт…";
  try{ const r = await api("/api/invoice",{amount:a}); if(!r.link) throw 0;
    tg.openInvoice(r.link, st=>{ if(st==="paid"){ hide("dep"); api("/api/balance",{}).then(b=>setBal(b.balance)) } else $("dmsg").textContent = st==="cancelled"?"Оплата отменена":"Статус: "+st });
  }catch(e){ $("dmsg").textContent="Не вышло. Открываю бота…"; tg?.openTelegramLink("https://t.me/"+BOT+"?start=deposit") }
  $("pay").disabled=false;
}
// ===== ГЛАВНЫЙ ЭКРАН =====
$("ti1").src=IMG.gift; $("ti2").src=IMG.wheel; $("ti3").src=IMG.cases;
const tops = Object.values(ITEMS).filter(x=>x.i!=="star").sort((a,b)=>b.p-a.p).slice(0,14);
$("marq").innerHTML = `<div class="mt">${[...tops,...tops].map(x=>`<img src="${IMG[x.i]}">`).join("")}</div>`;
$("ccount").textContent = CASES.filter(c=>!c.free).length+" кейсов";

// ===== РУЛЕТКА: 24 сектора, возврат ~89,6% =====
const RM=[0,1.5,0,3,0,1.5,0,5,0,1.5,0,1.5,0,3,0,1.5,0,1.5,0,0,1.5,0,0,1.5], RC={0:"#1b1c30",1.5:"#17b8d8",3:"#8b5cff",5:"#ff3df0"};
let rrot=0, rhist=ld("rh",[]);
(function(){ const R=146,n=RM.length,a=360/n; let s="";
  const p=d=>{const r=(d-90)*Math.PI/180;return [150+R*Math.cos(r),150+R*Math.sin(r)]};
  RM.forEach((m,i)=>{ const [x1,y1]=p(i*a),[x2,y2]=p((i+1)*a);
    s+=`<path d="M150 150L${x1} ${y1}A${R} ${R} 0 0 1 ${x2} ${y2}Z" fill="${RC[m]}" stroke="#090912" stroke-width="2"/>`;
    if(m) s+=`<text x="150" y="40" fill="#fff" font-size="15" font-weight="800" text-anchor="middle" transform="rotate(${i*a+a/2} 150 150)">x${m}</text>` });
  $("rw").innerHTML=`<svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="149" fill="#090912" stroke="#8b5cff" stroke-width="2"/><g id="rg">${s}</g><circle cx="150" cy="150" r="28" fill="#090912" stroke="#8b5cff" stroke-width="3"/></svg>`; })();
function setBet(v){ $("rbet").value = Math.max(1,Math.min(Math.floor(v)||1,Math.max(balance,1),100000)) }
function rhistR(){ $("rhist").innerHTML = rhist.map(m=>`<span style="background:${RC[m]}">${m?"x"+m:"0"}</span>`).join("") }
function rspin(){
  if(busy) return; const bet=Math.floor(+$("rbet").value); if(!(bet>=1)) return;
  if(bet>balance) return openDep(bet-balance);
  busy=true; $("rgo").disabled=true; $("rres").textContent=""; setBal(balance-bet);
  const n=RM.length, a=360/n, i=Math.random()*n|0, m=RM[i], ang=i*a+a*(.15+.7*Math.random());
  const from=rrot, to=(Math.floor(rrot/360)+1)*360+360*6+(360-ang);
  anim(6500,from,to,x=>{ rrot=x; $("rg").setAttribute("transform",`rotate(${x} 150 150)`) },()=>{
    rrot=to%360; $("rg").setAttribute("transform",`rotate(${rrot} 150 150)`);
    const win=Math.floor(bet*m); if(win) setBal(balance+win);
    $("rres").innerHTML = m ? `<span style="color:var(--grn)">+${fmt(win-bet)} ★ (x${m})</span>` : `<span style="color:var(--red)">−${fmt(bet)} ★</span>`;
    rhist.unshift(m); rhist=rhist.slice(0,12); sv("rh",rhist); rhistR(); haptic(m?"success":"error"); busy=false; $("rgo").disabled=false });
}
setBal(balance); renderInv(); renderUp(); renderList("cases"); rhistR();
if(API_URL) api("/api/balance",{}).then(b=>setBal(b.balance)).catch(()=>{});
</script>
</body>
